<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thomas Plumpton — Staff Software Engineer</title>
    <meta
      name="description"
      content="Thomas Plumpton is a Staff Software Engineer at Matillion, building data platforms and polished front-ends in Kotlin, Spring Boot, React and TypeScript. Read the career, commit by commit."
    />
    <meta property="og:title" content="Thomas Plumpton — Staff Software Engineer" />
    <meta
      property="og:description"
      content="A career, rendered as a git log. Kotlin · Spring Boot · React · TypeScript."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23211d16'/%3E%3Cpath d='M16 4v6.5M16 21.5V28' stroke='%23f4efe6' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%23c96a2b' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
