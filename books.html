<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Shelf — Thomas Plumpton</title>
    <meta
      name="description"
      content="Everything Thomas Plumpton has read, drawn as a bookshelf: one spine per book, width set by page count. Mostly fantasy and science fiction."
    />
    <link rel="canonical" href="https://tomplum.github.io/profile/books.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tomplum.github.io/profile/books.html" />
    <meta property="og:title" content="The Shelf — Thomas Plumpton" />
    <meta
      property="og:description"
      content="A reading history drawn as a bookshelf. One spine per book, width set by page count."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23211d16'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia, serif' font-weight='700' font-size='16.5' letter-spacing='-1' fill='%23f4efe6'%3ET%3Ctspan fill='%23c96a2b'%3EP%3C/tspan%3E%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong theme.
      // Duplicated from index.html on purpose: it has to run before any module
      // loads, so it cannot come from the bundle.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/books.tsx"></script>
  </body>
</html>
